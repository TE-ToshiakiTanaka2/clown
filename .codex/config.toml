# Project-level Codex CLI configuration
# See: https://developers.openai.com/codex/config-advanced/

# Always-latest model with high reasoning effort for review quality
model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"

# Approval policy: require approval for all actions
# Options: "untrusted", "on-request", "on-failure", "never"
approval_policy = "on-request"

# Sandbox mode: restrict file writes to workspace only
# Options: "workspace-write", "danger-full-access"
sandbox_mode = "workspace-write"

# MCP servers available to Codex. The erd command docs projected into
# .tarnished/workflows/erd/ reference context7 for library documentation;
# this block makes that reference real on the Codex side. When the server
# is unavailable, agents fall back to built-in search/read tools.
[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

# Godot MCP server (godot-mcp): lets Codex drive the headless Godot 4 editor
# installed at /usr/local/bin/godot for the game/ project skeleton. See #1.
[mcp_servers.godot]
command = "node"
args = ["/home/vscode/tools/godot-mcp/build/index.js"]

[mcp_servers.godot.env]
GODOT_PATH = "/usr/local/bin/godot"
